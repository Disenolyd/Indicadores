{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - L y D Logistica y Distribucion</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0e7ef 0%, #f4f6fa 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 370px;
            margin: 60px auto;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.18);
            padding: 38px 32px 28px 32px;
            position: relative;
            transition: box-shadow 0.3s;
        }
        .login-container:hover {
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.22);
        }
        .logo {
            display: block;
            margin: 0 auto 18px auto;
            width: 90px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        h2 {
            color: #003366;
            text-align: center;
            margin-bottom: 22px;
            font-size: 2rem;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            color: #003366;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
            display: block;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #b0b8c1;
            border-radius: 7px;
            margin-top: 5px;
            font-size: 1rem;
            background: #f8fafc;
            transition: border 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border: 1.5px solid #336699;
            outline: none;
            background: #fff;
        }
        button {
            width: 100%;
            background: linear-gradient(90deg, #003366 0%, #336699 100%);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 7px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            transition: background 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background: linear-gradient(90deg, #336699 0%, #003366 100%);
            box-shadow: 0 4px 16px rgba(51,102,153,0.10);
        }
        .messages {
            color: #661c1c;
            margin-bottom: 14px;
            text-align: center;
            font-weight: bold;
            background: #ffeaea;
            border-radius: 6px;
            padding: 7px 0;
            border: 1px solid #ffb3b3;
        }
        @media (max-width: 500px) {
            .login-container {
                width: 98vw;
                min-width: 0;
                padding: 18px 4vw 18px 4vw;
            }
            h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Logo de la empresa -->
        <img src="{% static 'img/logo3.png' %}" alt="Logo L y D Colombia" class="logo">
        <h2>Iniciar Sesión</h2>
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    {{ message }}<br>
                {% endfor %}
            </div>
        {% endif %}     
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Correo electrónico</label>
                <input type="text" id="username" name="username" required placeholder="usuario@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Contraseña">
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
