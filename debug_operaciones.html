<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Operaciones 9 y 10</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-container { background: #f0f0f0; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .test-btn { background: #007cba; color: white; border: none; padding: 8px 15px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔧 Debug - Operaciones 9 y 10</h1>
    
    <div class="test-container">
        <h3>1. Verificar APIs</h3>
        <button class="test-btn" onclick="testAPI('operaciones9')">Test API Operaciones9</button>
        <button class="test-btn" onclick="testAPI('operaciones10')">Test API Operaciones10</button>
        <div id="api-results"></div>
    </div>
    
    <div class="test-container">
        <h3>2. Test Directo showSection</h3>
        <button class="test-btn" onclick="testShowSection('operaciones9')">Test showSection('operaciones9')</button>
        <button class="test-btn" onclick="testShowSection('operaciones10')">Test showSection('operaciones10')</button>
        <div id="showsection-results"></div>
    </div>
    
    <div class="test-container">
        <h3>3. Verificar Elementos DOM</h3>
        <button class="test-btn" onclick="checkDOMElements()">Verificar DOM</button>
        <div id="dom-results"></div>
    </div>
    
    <div class="test-container">
        <h3>4. Enlaces Directos</h3>
        <p><a href="http://localhost:8000/home/" target="_blank">🏠 Abrir Aplicación Principal</a></p>
        <p><a href="http://localhost:8000/api/indicadores/operaciones9/" target="_blank">📊 API Operaciones9</a></p>
        <p><a href="http://localhost:8000/api/indicadores/operaciones10/" target="_blank">📊 API Operaciones10</a></p>
    </div>

    <script>
        // Test API
        function testAPI(endpoint) {
            const resultDiv = document.getElementById('api-results');
            resultDiv.innerHTML += `<p>🔍 Probando API ${endpoint}...</p>`;
            
            fetch(`http://localhost:8000/api/indicadores/${endpoint}/`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    resultDiv.innerHTML += `
                        <div class="success">
                            ✅ ${endpoint}: ${data.data ? data.data.length : 0} registros
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>`;
                })
                .catch(error => {
                    resultDiv.innerHTML += `
                        <div class="error">
                            ❌ ${endpoint}: ${error.message}
                        </div>`;
                });
        }

        // Test showSection directamente
        function testShowSection(sectionId) {
            const resultDiv = document.getElementById('showsection-results');
            resultDiv.innerHTML += `<p>🔍 Testing showSection('${sectionId}')...</p>`;
            
            try {
                // Simular la función showSection básica
                const section = document.getElementById('section-' + sectionId);
                if (section) {
                    resultDiv.innerHTML += `
                        <div class="success">
                            ✅ Elemento encontrado: section-${sectionId}
                        </div>`;
                } else {
                    resultDiv.innerHTML += `
                        <div class="error">
                            ❌ Elemento NO encontrado: section-${sectionId}
                        </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML += `
                    <div class="error">
                        ❌ Error: ${error.message}
                    </div>`;
            }
        }

        // Verificar elementos DOM
        function checkDOMElements() {
            const resultDiv = document.getElementById('dom-results');
            resultDiv.innerHTML = '<h4>📋 Verificando elementos DOM:</h4>';
            
            const elementos = [
                'section-operaciones9',
                'section-operaciones10',
                'tabla-operaciones9',
                'tabla-operaciones10',
                'barChart-operaciones9',
                'barChart-operaciones10'
            ];
            
            elementos.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    resultDiv.innerHTML += `<div class="success">✅ ${id} - Encontrado</div>`;
                } else {
                    resultDiv.innerHTML += `<div class="error">❌ ${id} - NO encontrado</div>`;
                }
            });
            
            // Verificar botones con onclick
            const botones = document.querySelectorAll('button[onclick*="operaciones9"], button[onclick*="operaciones10"]');
            resultDiv.innerHTML += `<h4>🔲 Botones encontrados: ${botones.length}</h4>`;
            
            botones.forEach((btn, index) => {
                const onclick = btn.getAttribute('onclick');
                resultDiv.innerHTML += `<div>Botón ${index + 1}: ${onclick}</div>`;
            });
        }

        // Auto-verificar al cargar
        window.onload = function() {
            console.log('🚀 Página de debug cargada');
            checkDOMElements();
        };
    </script>
</body>
</html>
